[build]
  # The directory where the React app lives
  base = "backend/proctor-ai-guardian-main"
  
  # The command to build the app
  command = "npm run build"
  
  # The directory to publish (relative to the base directory)
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
